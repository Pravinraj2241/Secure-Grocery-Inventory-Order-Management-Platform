# =========================================================
# Grocery Management System - Default Configuration (MySQL)
# =========================================================

spring.application.name=grocery-management-system
server.port=8080

# ---- Active profile ----
# Set to "mysql" (default) to use MySQL, or run with -Dspring.profiles.active=h2
# to use an in-memory H2 database (zero setup, great for quick demo/testing).
spring.profiles.active=mysql

# =========================================================
# JWT Configuration
# =========================================================
# IMPORTANT: change this secret before deploying to production.
jwt.secret=ChangeThisSuperSecretKeyBeforeGoingToProduction123456
jwt.expiration.ms=86400000

# =========================================================
# Jackson
# =========================================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# =========================================================
# Misc
# =========================================================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
