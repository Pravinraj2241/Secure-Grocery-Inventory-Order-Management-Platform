# =========================================================
# H2 Profile - zero setup, in-memory database
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# =========================================================

spring.datasource.url=jdbc:h2:mem:grocery_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console available at /h2-console (useful for demoing / screenshots)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
